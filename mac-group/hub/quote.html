<!doctype html>
<html lang="en-CA" data-site="hub" data-page="hub/quote.html" data-root="../">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAC Hub Quotes</title><meta name="description" content="Staff quoting app."><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="quote.webmanifest"><link rel="apple-touch-icon" href="../icons/options/quote-C-180.png"><meta name="theme-color" content="#0F1115"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="../mac.css">
<link rel="stylesheet" href="../app.css"></head>
<body>
<div class="sample" style="background:#7C9CFF;color:#0F1115">Private preview · sample data is marked</div>

<div class="hub" id="quote">
  <aside class="hub-rail">
    <div class="hub-brand"><span class="mlogo " role="img" aria-label="MAC Group of Companies" style="width:110px;aspect-ratio:1189/721;-webkit-mask-image:url(../img/logos/mgc-monogram.png);mask-image:url(../img/logos/mgc-monogram.png)"></span><b>Hub</b><span>Staff only</span></div>
    <nav class="hub-tabs">
      <a class="hub-tablink" href="index.html"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Today</a>
      <a class="hub-tablink on" href="quote.html"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Quote Builder</a>
      <a class="hub-tablink" href="index.html#inv"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7 12 3l9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4M12 11v10"/></svg>Inventory</a>
      <a class="hub-tablink" href="../apps/index.html"><svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg>Client apps</a>
    </nav>
    <a class="hub-back" href="../index.html">Back to MAC Group</a>
  </aside>
  <main class="hub-main">
    <div class="hub-top"><div><span class="eyebrow">Quote Builder · sample inventory</span><h1 class="hub-h">Quote <span data-qno></span></h1></div>
      <div class="qb-brands" role="group" aria-label="Selling company"><button data-b="mss">MAC Show Systems</button><button data-b="psi">PSI</button><button data-b="ttl">Tour Trucking</button></div></div>
    <div class="qb">
      <div class="qb-pane">
        <h3>Client and dates</h3>
        <div class="qb-grid">
          <label class="field wide"><span>Client</span><input data-f="client"></label>
          <label class="field"><span>Contact</span><input data-f="contact"></label>
          <label class="field"><span>Event</span><input data-f="ev"></label>
          <label class="field wide"><span>Venue</span><input data-f="venue"></label>
          <label class="field"><span>From</span><input type="date" data-f="a"></label>
          <label class="field"><span>To</span><input type="date" data-f="z"></label>
        </div>
        <h3>Live stock on these dates</h3>
        <label class="field"><span>Find gear</span><input data-find placeholder="LED, speaker, stage..."></label>
        <div class="qb-stock" data-stock></div>
        <div class="qb-chips" data-svc></div>
      </div>
      <div>
        <div class="qb-pane"><h3>Lines · you type every rate</h3><div data-lines></div>
          <div class="qb-grid" style="margin-top:14px"><label class="field"><span>Tax %</span><input inputmode="decimal" data-f="tax"></label><label class="field"><span>Note to client</span><input data-f="note" placeholder="Optional"></label></div>
          <h3 style="margin-top:18px">Staff flags · never shown to the client</h3><div data-flags></div></div>
        <div class="qb-acts"><button class="btn" data-send>Send to client</button><button class="btn ghost" data-print>Save as PDF</button><button class="btn ghost" data-hold>Hold stock 48 hours</button><button class="btn ghost" data-new>New quote</button></div>
        <div data-doc></div><div data-mail></div>
      </div>
    </div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="../mac.js"></script><script src="../inv-names.js"></script><script src="../tools.js"></script><script src="../quote.js"></script>
</body></html>
