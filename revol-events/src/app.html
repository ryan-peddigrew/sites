<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131516">
<title>REVOL HUB · REVOL Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fira+Sans:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--or:#F05A28;--or2:#E04410;--ink:#131516;--ink2:#1D1D1D;--ink3:#272727;--mut:#6b6b6b;--line:#e7e2df;--bg:#F6F3F1;--card:#fff;--ok:#2E7D4F;--warn:#C98A00;--bad:#C8341B;
--hd:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--ui:'Montserrat',Arial,sans-serif;--bd:'Fira Sans',Arial,sans-serif;--r:6px;--nav:68px}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--bd);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
img{max-width:100%;display:block}button,input,select,textarea{font:inherit}a{color:inherit}
h1,h2,h3{font-family:var(--hd);font-weight:400;letter-spacing:.02em;line-height:.95;margin:0;text-transform:uppercase}
.k{font:700 11.5px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:0;border-radius:var(--r);background:var(--or);color:#fff;font:700 13px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.dk{background:var(--ink)}.btn.gh{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}.btn.sm{min-height:44px;padding:0 12px;font-size:12px}
.btn:active{transform:translateY(1px)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* loader */
#ld{position:fixed;inset:0;z-index:9999;background:var(--ink);display:grid;place-items:center;transition:opacity .5s .1s,visibility .6s}
#ld.out{opacity:0;visibility:hidden}
#ld .lw{display:flex;flex-direction:column;align-items:center;gap:18px}
#ld .rm{width:72px;height:72px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#ld .mw{font:400 64px/1 var(--hd);letter-spacing:.18em;color:#fff;display:flex;overflow:hidden}
#ld .mw span{display:inline-block;transform:translateY(110%);animation:up .5s cubic-bezier(.2,.9,.3,1) forwards}
#ld .bar{width:180px;height:3px;background:#ffffff22;overflow:hidden}#ld .bar i{display:block;height:100%;width:0;background:var(--or);animation:fill 1.3s .2s ease forwards}
#ld small{color:#ffffff99;font:700 11px var(--ui);letter-spacing:.2em}
@keyframes pop{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}@keyframes up{to{transform:none}}@keyframes fill{to{width:100%}}
/* top */
.top{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:44px}
.top .brand img{width:34px;height:34px}
.top .brand b{font:400 30px/1 var(--hd);letter-spacing:.14em}
.top .brand em{font:700 10px/1.2 var(--ui);letter-spacing:.16em;color:#ffffffaa;font-style:normal;display:block}
.top .sp{flex:1}.top .clock{font:600 12px/1.2 var(--ui);letter-spacing:.08em;text-align:right;color:#ffffffcc}
.top .clock b{display:block;color:#fff;font-size:13px}
.sample{background:var(--or);color:#fff;font:700 11px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:7px 16px;text-align:center}
/* layout */
.shell{display:block}
nav.side{display:none}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bot a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--nav);color:#ffffffa0;text-decoration:none;font:700 10px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase}
.bot a.on{color:#fff;box-shadow:inset 0 3px 0 var(--or)}
@media(min-width:1000px){body{padding-bottom:0}.bot{display:none}.shell{display:grid;grid-template-columns:230px 1fr}
nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px;height:calc(100vh - 64px);background:var(--ink2);padding:18px 12px;overflow:auto}
nav.side a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:var(--r);color:#ffffffb0;text-decoration:none;font:700 12.5px var(--ui);letter-spacing:.1em;text-transform:uppercase}
nav.side a.on{background:#ffffff12;color:#fff;box-shadow:inset 3px 0 0 var(--or)}nav.side a:hover{color:#fff}
nav.side .grp{margin:16px 12px 6px;color:#ffffff55}main{padding:26px 28px 60px}}
/* blocks */
.hello{position:relative;border-radius:10px;overflow:hidden;color:#fff;min-height:210px;display:flex;align-items:flex-end;background:#000}
.hello img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hello .in{position:relative;padding:20px}
.hello h1{font-size:clamp(44px,9vw,84px)}.hello p{margin:6px 0 0;max-width:560px;color:#ffffffdd}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line);text-decoration:none;display:block}
.kpi b{display:block;font:400 44px/1 var(--hd);letter-spacing:.02em}.kpi b small{font-size:22px;color:var(--mut)}
.kpi.red b{color:var(--bad)}
.sec{margin-top:26px}.sec>header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec h2{font-size:34px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.grid.c3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pc{display:grid;grid-template-columns:92px 1fr;text-decoration:none;color:inherit;min-height:112px}
.pc .ph{position:relative;background:#ddd}.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:12px 14px;min-width:0}
.pc h3{font-size:24px;margin:3px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .meta{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font:700 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;border-radius:3px;background:#f1ece9;color:var(--ink3)}
.tag.cat{background:#fde7de;color:#a33a12}.tag.hol{background:#e3efe7;color:#1f5e3a}.tag.blc{background:var(--ink);color:#fff}.tag.evt{background:#e7e5f6;color:#3b3392}
.tag.ok{background:#e3efe7;color:var(--ok)}.tag.wa{background:#fbf0d4;color:#7a5600}.tag.no{background:#fbe2dc;color:var(--bad)}
.rd{display:flex;align-items:center;gap:8px;margin-top:8px}.rd .tr{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden}.rd .tr i{display:block;height:100%}
.rd span{font:700 12px var(--ui);min-width:38px;text-align:right}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:var(--r);border:2px solid var(--ink);background:transparent;font:700 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:var(--r);padding:0 14px;background:#fff;font-size:16px;margin-bottom:10px}
.alist{display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:var(--r);padding:12px 14px;text-decoration:none}
.al.w{border-left-color:var(--warn)}.al b{display:block;font:700 13px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.04em}.al span{font-size:13.5px;color:var(--mut)}
.al .i{color:var(--bad)}.al.w .i{color:var(--warn)}
.dayh{font:700 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.dayh::after{content:"";flex:1;height:1px;background:var(--line)}
/* project detail */
.phero{position:relative;margin:-18px -16px 0;min-height:300px;display:flex;align-items:flex-end;color:#fff;background:#000;overflow:hidden}
@media(min-width:1000px){.phero{margin:-26px -28px 0}}
.phero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.phero .in{position:relative;padding:18px 16px 20px;width:100%}
.phero h1{font-size:clamp(42px,8vw,80px);margin:8px 0}
.phero .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font:600 13px/1.4 var(--ui);letter-spacing:.04em}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font:700 12px var(--ui);letter-spacing:.12em;min-height:44px}
.ready{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.ready .big{font:400 54px/1 var(--hd)}
.ready ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13.5px}
.ready li b{font-family:var(--ui);font-size:12.5px}
.tabs{position:sticky;top:64px;z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;margin-top:6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:var(--r);background:#fff;font:700 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button.on{background:var(--or);color:#fff;box-shadow:none}
.pane{display:none}.pane.on{display:block}
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.t th{font:700 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px;border-bottom:2px solid var(--ink)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}.row b{font:700 13.5px/1.3 var(--ui);display:block;text-transform:uppercase;letter-spacing:.03em}.row span{font-size:13.5px;color:var(--mut)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slot{min-height:44px;padding:0 10px;border-radius:var(--r);border:1px dashed #bbb;background:#fff;font:600 12.5px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.slot.c{border:1px solid var(--ok);background:#eaf4ee;color:var(--ok)}.slot.a{border:1px solid var(--warn);background:#fdf5e1;color:#7a5600}
.meter{font:400 30px/1 var(--hd)}
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.tli .dot{position:absolute;left:-20px;top:16px;width:12px;height:12px;background:#fff;border:2px solid var(--ink);transform:rotate(45deg)}
.tli.d .dot{background:var(--or);border-color:var(--or)}
.tli .tm{font:400 24px/1 var(--hd);min-width:62px;padding-top:4px}
.tli .tx{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center}
.tli.d .tx b{text-decoration:line-through;color:var(--mut)}
.ck{width:26px;height:26px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;flex:none;background:#fff;cursor:pointer}
.ck.on{background:var(--or);border-color:var(--or);color:#fff}
.ckw{min-width:44px;min-height:44px;display:grid;place-items:center;cursor:pointer;background:none;border:0;padding:0}
.menu-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:8px}
.menu-item img{width:64px;height:64px;object-fit:cover;border-radius:4px}
.menu-item b{font:700 13px/1.3 var(--ui);text-transform:uppercase;display:block}.menu-item span{font-size:13px;color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 16px;margin-top:10px}
.tot b{font:400 34px/1 var(--hd);letter-spacing:.03em}
form.f{display:grid;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
form.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.l{display:grid;gap:6px;font:700 11.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
label.l input,label.l select,label.l textarea{min-height:48px;border:1px solid #d9d3cf;border-radius:var(--r);padding:10px 12px;font:400 16px var(--bd);letter-spacing:0;text-transform:none;background:#fff;color:var(--ink);width:100%}
.calc{background:#fdf1ec;border:1px solid #f6cdbd;border-radius:var(--r);padding:12px;font-size:14px}
.calc b{font:400 30px/1 var(--hd);display:block}
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:760px){.team{grid-template-columns:repeat(4,1fr)}}
.tm{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tm img{aspect-ratio:1;object-fit:cover;width:100%;filter:grayscale(1)}
.tm div{padding:10px 12px}.tm b{font:400 24px/1 var(--hd);display:block}.tm span{font-size:12.5px;color:var(--mut)}
.av{width:40px;height:40px;border-radius:6px;object-fit:cover;filter:grayscale(1);flex:none}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk .d{background:#fff;border:1px solid var(--line);border-radius:4px;min-height:96px;padding:6px;font-size:12px;overflow:hidden}
.wk .d.td{box-shadow:inset 0 0 0 2px var(--or)}
.wk .d .n{font:400 20px/1 var(--hd)}
.wk .d a{display:block;margin-top:4px;padding:3px 4px;border-radius:3px;text-decoration:none;font:600 10.5px/1.25 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .hd{font:700 10.5px var(--ui);letter-spacing:.1em;text-align:center;color:var(--mut);padding:4px 0}
.e-cat{background:#fde7de;color:#a33a12}.e-hol{background:#e3efe7;color:#1f5e3a}.e-blc{background:var(--ink);color:#fff}.e-evt{background:#e7e5f6;color:#3b3392}
.blc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:760px){.blc{grid-template-columns:repeat(4,1fr)}}
.blcd{border-radius:var(--r);padding:12px;background:#fff;border:1px solid var(--line);text-decoration:none;min-height:96px}
.blc5{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}.blcd.ld{background:#fde7de;border-color:#f6cdbd;color:#7a2a0c}.blcd.bk{background:var(--ink);color:#fff;border-color:var(--ink)}.blcd .n{font:400 26px/1 var(--hd)}.blcd span{font-size:12.5px;opacity:.8;display:block}
.drop{border:2px dashed #c9c0bb;border-radius:var(--r);padding:18px;text-align:center;background:#fff}
.note{background:#fff;border-left:4px solid var(--or);padding:12px 14px;border-radius:var(--r);font-size:14px}
.feed{display:flex;flex-direction:column;gap:6px}.feed div{display:flex;gap:10px;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}.feed time{font:700 11.5px var(--ui);color:var(--mut);min-width:64px}
/* chat */
#chatbtn{position:fixed;right:12px;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));z-index:70;height:48px;padding:0 14px;border-radius:8px;border:0;background:var(--or);color:#fff;font:700 12px var(--ui);letter-spacing:.12em;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #0004;cursor:pointer}
@media(max-width:999px){#chatbtn{display:none}}@media(min-width:1000px){#askTop{display:none}}@media(max-width:420px){.top .clock{display:none}}@media(min-width:1000px){#chatbtn{bottom:22px;right:22px}}
#chat{position:fixed;inset:auto 0 0 0;z-index:80;height:min(82vh,640px);background:#fff;border-radius:12px 12px 0 0;box-shadow:0 -10px 40px #0005;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s}
#chat.on{transform:none}
@media(min-width:760px){#chat{left:auto;right:22px;bottom:22px;width:400px;border-radius:12px}}
#chat header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--ink);color:#fff;border-radius:12px 12px 0 0}
#chat header b{font:400 26px/1 var(--hd);letter-spacing:.1em;flex:1}
#chat header button{min-width:44px;min-height:44px;background:none;border:0;color:#fff;cursor:pointer;font:700 12px var(--ui);letter-spacing:.1em}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.m{max-width:86%;padding:10px 12px;border-radius:8px;font-size:14.5px;line-height:1.45;background:#fff;border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}
.m a{color:var(--or2);font-weight:600}
.sug{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;scrollbar-width:none}.sug button{flex:none;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:600 12px var(--ui);cursor:pointer}
#chat form{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#chat input{flex:1;min-height:48px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:16px}
/* sheet */
#more{position:fixed;inset:0;z-index:90;background:#0007;display:none}#more.on{display:block}
#more .s{position:absolute;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:#fff;border-radius:12px 12px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
#more a{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 8px;text-decoration:none;font:700 13px var(--ui);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 80px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:6px;font:600 13px var(--ui);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
/* footer + watermark */
footer.ft{background:var(--ink);color:#ffffffb0;padding:22px 16px calc(var(--nav) + 30px);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;font-size:13px}
@media(min-width:1000px){footer.ft{padding-bottom:26px}}
footer.ft img{width:150px;height:auto}
.pbc{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#ffffffcc;min-height:44px;font:500 14px/1 var(--bd)}.pbc b{color:#fff;font-weight:700}
.pbc-mark{width:26px;height:26px;perspective:200px}.pbc-mark svg{width:100%;height:100%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
#wm{position:fixed;inset:0;z-index:2147483000;pointer-events:none;user-select:none;-webkit-user-select:none;background-repeat:repeat}
@media print{body>*:not(#wm){visibility:hidden}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tour{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));z-index:96;background:var(--ink);color:#fff;border-radius:10px;padding:16px;box-shadow:0 14px 40px #0006;max-width:480px;margin:0 auto;border-top:4px solid var(--or)}
@media(min-width:1000px){.tour{left:auto;right:24px;bottom:24px}}

function stats(p){const s=byP(STF,p.id),v=byP(VEN,p.id),tl=byP(TL,p.id),c=byP(CAT,p.id);
 const need=s.length,conf=s.filter(x=>x.state==='confirmed').length,alloc=s.filter(x=>x.state==='allocated').length,open=need-conf-alloc;

 const final=p.status!=='Final count due'&&p.status!=='Contract out';
 const score=Math.round(100*((need?conf/need:1)*.45+(v.length?vc/v.length:1)*.3+(final?1:0)*.15+(tl.length?td/tl.length:0)*.1));
 return {need,conf,alloc,open,vn:v.length,vc,tln:tl.length,td,hours,food,score,final}}

function scoreTx(tx){const L=tx.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(?:\[?[\d:]+\]?\s*)?([^:]{1,30}):\s*(.*)$/);return m?{w:m[1].trim(),t:m[2]}:null}).filter(Boolean);
 if(L.length<2)return null;const rep=L[0].w;const words=x=>x.t.split(/\s+/).filter(Boolean).length;
 const rw=L.filter(x=>x.w===rep).reduce((a,x)=>a+words(x),0),all=L.reduce((a,x)=>a+words(x),0)||1;
 let mono=0,cur=0;L.forEach(x=>{if(x.w===rep){cur+=words(x);mono=Math.max(mono,cur)}else cur=0});
 const q=L.filter(x=>x.w===rep).reduce((a,x)=>a+(x.t.match(/\?/g)||[]).length,0);const cl=L.filter(x=>x.w!==rep).map(x=>x.t).join(' ');const T=L.map(x=>x.t).join(' ');
 const f=[];const g=T.match(/(\d[\d,]{1,6})\s*(guests|people|pax|staff|employees)/i);if(g)f.push(['Guests',g[1]]);
 const dt=T.match(/(january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2}/i);if(dt)f.push(['Date',dt[0]]);
 const b=T.match(/\$\s?[\d,]+(\.\d+)?k?/i);if(b)f.push(['Budget',b[0]]);
 const v=T.match(/better living centre|exhibition place|[A-Z][\w']+ (hall|centre|center|club|studios|gallery)/i);if(v)f.push(['Venue',v[0]]);
 const di=(T.match(/vegan|vegetarian|gluten[- ]free|halal|kosher|nut[- ]free|dairy[- ]free/gi)||[]);if(di.length)f.push(['Dietary',[...new Set(di.map(x=>x.toLowerCase()))].join(', ')]);
 const ob=[];if(/expensive|too much|over budget|price|cost/i.test(cl))ob.push('Price');if(/another caterer|other caterer|competitor|quoting/i.test(cl))ob.push('Competitor');if(/move it|reschedul|not final|not sure|confirm later/i.test(cl))ob.push('Timing');
 const ns=L.filter(x=>x.w===rep).slice(-3).map(x=>x.t).find(t=>/(i'll|i will|let me|send|book|hold|call|meet)/i.test(t));
 return {rep,talk:Math.round(rw/all*100),q,mono,f,ob,ns,lines:L.length}}

function parseCSV(s){const rows=[];let r=[],v='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){v+='"';i++}else q=false}else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());return rows.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}

const firstBLC=()=>{const b=P.find(p=>p.type==='blc'&&p.sub!=='load'&&dayDiff(p.date)>=0);return b?'#/p/'+b.id:'#/blc'};
const STEPS=[
 ['#/','Jonny, this is the REVOL HUB','You built a CRM that keeps your reps organised. This is the layer above it. It joins every sale to what happens next, staffing, vendors, kitchen and finance, and shows you how each rep actually sells.','.hello'],
 ['#/sales/1','Flex, twice a day','The same Flex Catering report your CRM pulls at 7 and 1. Every change is applied for you: more guests adds servers, a new start time goes straight to staff and vendors.','.tw'],
 ['#/sales/2','Deals move from email','Proposal out, client asks for the agreement, signed copy back. The deal moves on its own, and a signed deal builds the event in one tap.','.alist'],
 ['#/sales/3','Every call, recorded and summarised','Calls and meetings are transcribed. Guest count, date, venue, dietary needs and budget land on the deal. You can hear any call without sitting in on it.','.alist'],
 ['#/sales/4','Coach how they sell','Talk time, questions asked, next step set, speed to a new lead. Your CRM shows what a rep closed. This shows why, and what to coach this week.','.tw'],
 ['#/sales/5','Know what will close','A forecast weighted by stage, every deal at risk with the reason, and the next best action. It also warns you when sales is about to sign a day REVOL can\'t staff.','.cov'],
 ['#/sales/6','No deal goes quiet','Follow-up plans drafted in each rep\'s voice, including rebooking last year\'s Flex clients before the calendar fills. That one is new revenue.','.grid'],
 ['#/sales/7','Every rep\'s day','Scheduled against worked for each rep, with emails, replies, calls and proposals. Built from their calendar and inbox, no timesheets.','.card'],
 ['#/sales/8','What\'s waiting on a rep','Every hand-off operations can\'t finish without sales, and exactly which shifts or vendor requests it is holding up.','.alist'],
 ['#/sales/0','One tap: won becomes an event','Mark a deal won and the hub builds the event: every shift from your ratios, every vendor request, the menu and the run of show.','.board'],
 ['#/staff','Staffing and vendors, already moving','Two weeks of coverage and one vendor grid, fed by the deals you just saw. Busy days show up before the scramble, not during it.','.cov'],
 ['#/diy','Yours to try, privately','Download it, upload your own Flex and CRM exports, paste a real call. It runs on your computer and nothing comes back to me. Ryan','.flow']];
let ti=0,tp=false,tt=null,tstart=0,tleft=0;const DUR=9000;
function tshow(){const st=STEPS[ti];const r=typeof st[0]==='function'?st[0]():st[0];$('#chat').classList.remove('on');if(location.hash!==r)location.hash=r;else route();
 setTimeout(()=>{if(st[4]&&st[4]!=='chat')showTab(st[4]);if(st[4]==='chat'){$('#chat').classList.add('on');if(!msgs.children.length)say('Hi, this is the REVOL HUB. Ask me about any project, shift, vendor or order.');setTimeout(()=>{say(esc("What's on Friday?"),1);setTimeout(()=>say(answer("What's on Friday?")),300)},400)}
  $$('.hl').forEach(e=>e.classList.remove('hl'));if(st[3]){const el=$(st[3]);if(el){el.classList.add('hl');el.scrollIntoView({behavior:'smooth',block:'center'})}}else scrollTo({top:0,behavior:'smooth'})},150);
 $('#tn').textContent=(ti+1)+' / '+STEPS.length;$('#th').textContent=st[1];$('#tp').textContent=st[2];$('#tnx').textContent=ti===STEPS.length-1?'FINISH':'NEXT';tp=false;$('#tpa').textContent='PAUSE';trun(DUR)}
function trun(ms){clearTimeout(tt);tleft=ms;tstart=Date.now();const b=$('#tbi');b.style.transition='none';b.style.width=(100*(1-ms/DUR))+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition=`width ${ms}ms linear`;b.style.width='100%'}));tt=setTimeout(tnext,ms)}
function tnext(){if(ti<STEPS.length-1){ti++;tshow()}else tend()}
function tend(){clearTimeout(tt);$('#tour').classList.add('hide');document.body.classList.remove('tour-on');$$('.hl').forEach(e=>e.classList.remove('hl'))}
$('#tnx').onclick=()=>tnext();$('#tend').onclick=tend;
$('#tpa').onclick=()=>{const b=$('#tbi');if(!tp){tp=true;clearTimeout(tt);tleft-=Date.now()-tstart;const w=getComputedStyle(b).width;b.style.transition='none';b.style.width=w;$('#tpa').textContent='PLAY'}else{tp=false;$('#tpa').textContent='PAUSE';trun(Math.max(800,tleft))}};
addEventListener('hashchange',()=>{route();if(!keepScroll)scrollTo(0,0);keepScroll=false;$('#chat').classList.remove('on')});
route();
const TOUR=/[?&]tour=1/.test(location.search);setTimeout(()=>{$('#ld').classList.add('out');if(TOUR){document.body.classList.add('tour-on');$('#tour').classList.remove('hide');ti=0;tshow()}},TOUR?1100:1500);
})();
</script>
