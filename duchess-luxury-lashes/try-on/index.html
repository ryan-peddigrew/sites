<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lash try-on · Duchess Luxury Lashes</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--iv:#0B0908;--iv2:#14110F;--ink:#F3ECE2;--deep:#000;--mu:#A39589;--line:rgba(243,236,226,.14);--card:#F1EBE3;--lt:#F3ECE2;--bk:#0B0908}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--iv);color:var(--ink);font:300 16px/1.65 Jost,sans-serif;overflow-x:clip;font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3,blockquote,summary,.serif{font-family:'Cormorant Garamond',serif;font-weight:300;font-variant-numeric:lining-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px}
.eyebrow{font:400 11px Jost;letter-spacing:.34em;text-transform:uppercase;color:var(--mu)}
h2{font-size:clamp(40px,6.4vw,76px);line-height:1;letter-spacing:-.01em}
h2 em{font-style:italic;font-weight:300}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 34px;font:400 11px Jost;letter-spacing:.3em;text-transform:uppercase;border:1px solid currentColor;transition:background .3s,color .3s}
.btn.dk{background:var(--ink);color:var(--iv);border-color:var(--ink)}
.btn.dk:hover{background:#fff;border-color:#fff}
.btn.lt:hover{background:var(--ink);color:var(--iv)}
.btn.wh{color:#fff}.btn.wh:hover{background:#fff;color:var(--bk)}
.btn.whs{background:#fff;color:var(--bk);border-color:#fff}

/* preloader */
#pre{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pre .mark{position:relative;width:min(300px,64vw);color:#fff}
#pre .mark svg{width:100%;display:block;clip-path:inset(0 0 100% 0);animation:wipe .75s cubic-bezier(.65,0,.35,1) .1s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
#pre .sp{position:absolute;left:50%;top:4%;width:14px;height:14px;transform:translate(-50%,-50%) scale(0);opacity:0;animation:spark .55s ease-out .8s both}
#pre .sp::before,#pre .sp::after{content:"";position:absolute;inset:0;background:#fff;border-radius:2px}
#pre .sp::before{clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
#pre .sp::after{transform:rotate(45deg) scale(.55);clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
#pre .ring{position:absolute;left:50%;top:4%;width:6px;height:6px;border-radius:50%;border:1px solid rgba(255,255,255,.9);transform:translate(-50%,-50%);opacity:0;animation:ring .6s ease-out .85s both}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:0}40%{transform:translate(-50%,-50%) scale(2.6) rotate(20deg);opacity:1}100%{transform:translate(-50%,-50%) scale(0) rotate(45deg);opacity:0}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(1);opacity:.9}100%{transform:translate(-50%,-50%) scale(14);opacity:0}}
#pre.off{opacity:0;pointer-events:none}
body:not(.ready) .hero .ph img,body:not(.ready) .hero .crown *,body:not(.ready) .hero h1,body:not(.ready) .hero .htag,body:not(.ready) .hero .shine,body:not(.ready) .hero .sub,body:not(.ready) .hero p,body:not(.ready) .hero .cta{animation-play-state:paused}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(11,9,8,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:84px}
.hd nav{display:flex;gap:28px;font:400 11px Jost;letter-spacing:.26em;text-transform:uppercase}
.hd nav a{min-height:44px;display:flex;align-items:center;position:relative}
.hd nav a::after{content:"";position:absolute;left:0;right:100%;bottom:10px;height:1px;background:var(--ink);transition:right .3s}
.hd nav a:hover::after{right:0}
.hd .logo svg{height:68px;width:auto;display:block}
.hd .right{display:flex;justify-content:flex-end}
.icon{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font:400 11px Jost;letter-spacing:.26em;text-transform:uppercase}
.menu-btn{display:none;justify-self:start}
@media (max-width:860px){.hd nav{display:none}.menu-btn{display:inline-flex}.hd{height:78px}.hd .logo svg{height:62px}}
.drawer-nav{position:fixed;inset:0;z-index:60;background:var(--deep);color:var(--lt);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;transform:translateY(-100%);transition:transform .55s cubic-bezier(.7,0,.2,1)}
.drawer-nav.on{transform:none}
.drawer-nav a{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:44px;min-height:62px;display:flex;align-items:center}
.drawer-nav .x{position:absolute;top:18px;right:14px;color:var(--lt)}

/* hero (restored: white logo on colour photo) */
.hero{position:relative;text-align:center;min-height:calc(100svh - 84px);display:flex;align-items:flex-end;justify-content:center;padding:60px 0 56px;overflow:hidden;background:#1a1412;color:#fff}
.hero .ph{position:absolute;inset:0}
.hero .ph img{width:100%;height:100%;object-fit:cover;object-position:58% 32%;animation:kb 18s ease-out both}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,.1) 45%,rgba(0,0,0,.88) 100%)}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1.02)}}
.hero .ph img{animation:kb 2.4s cubic-bezier(.2,.7,.2,1) both,drift 22s ease-in-out 2.4s infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09) translate(-1.5%,-1%)}}
.hero .wrap{position:relative;z-index:2}
.hero .crown{color:#fff;width:min(150px,36vw);margin:0 auto}
.hero .crown path,.hero .crown circle{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) both}
.hero .crown :nth-child(odd){animation-delay:.15s}.hero .crown :nth-child(3n){animation-delay:.3s}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.hero h1{font:400 clamp(52px,12vw,140px)/.9 'Cormorant Garamond',serif;letter-spacing:.14em;margin:18px 0 0 .14em;text-transform:uppercase;color:#fff;animation:focus 1.6s .4s both}
.hero .htag{font:400 12px Jost;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:12px;animation:focus 1.6s .6s both}
.hero .sub{font:italic 400 clamp(24px,4vw,34px) 'Cormorant Garamond',serif;margin-top:22px;animation:focus 1.6s .7s both}
.hero p{max-width:460px;margin:14px auto 0;color:rgba(255,255,255,.85);animation:focus 1.6s .9s both}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;animation:focus 1.6s 1.1s both}
.hero .btn{border-color:#fff;color:#fff}.hero .btn.dk{background:#fff;color:var(--bk);border-color:#fff}.hero .btn:not(.dk):hover{background:#fff;color:var(--bk)}
.hero h1{background:linear-gradient(100deg,#fff 0 40%,#fff9 47%,#fff 50%,#fff9 53%,#fff 60% 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:focus 1.6s .4s both,shine 5s ease-in-out 2.2s infinite}
@keyframes shine{0%,60%{background-position:100% 0}100%{background-position:-50% 0}}
.hero .scroll{position:absolute;left:50%;bottom:14px;width:1px;height:34px;background:rgba(255,255,255,.25);overflow:hidden;z-index:3}
.hero .scroll::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:#fff;animation:drop 2s ease-in-out infinite}
@keyframes drop{to{top:100%}}
.marq{overflow:hidden;border-bottom:1px solid var(--line);background:var(--deep);padding:18px 0}
.marq div{display:flex;gap:44px;width:max-content;animation:mq 38s linear infinite;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:26px;color:var(--lt);white-space:nowrap}
.marq i{width:5px;height:5px;border-radius:50%;background:var(--mu);align-self:center;flex:0 0 auto}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes focus{from{opacity:0;filter:blur(12px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
@media (max-width:860px){.hero{min-height:calc(100svh - 78px);padding-bottom:64px}.hero .ph img{object-position:58% 18%}.hero p{display:none}.hero .crown{width:96px}.hero h1{font-size:58px;margin-top:12px}.hero .sub{margin-top:14px}.hero .cta{margin-top:24px}.hero .cta .btn{min-width:240px}}
/* statement */
.state{padding-top:120px;padding-bottom:40px;text-align:center}
.state p{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(30px,4.4vw,54px);line-height:1.15;max-width:22ch;margin:0 auto}
.state p i{font-style:italic}
.state small{display:block;margin-top:26px;font:400 11px Jost;letter-spacing:.34em;text-transform:uppercase;color:var(--mu)}
@media (max-width:860px){.state{padding-top:80px;padding-bottom:30px}}

/* seen at */
.seen{background:var(--deep);color:var(--lt);padding-top:96px;padding-bottom:72px}
.seen .eyebrow{color:#9d9287}
.events{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);margin-top:30px;border-top:1px solid rgba(244,237,227,.14)}
.events li{padding:30px 28px 30px 0;border-bottom:1px solid rgba(244,237,227,.14)}
.events li:nth-child(3n+2){padding-left:28px;border-left:1px solid rgba(244,237,227,.14);border-right:1px solid rgba(244,237,227,.14)}
.events li:nth-child(3n){padding-left:28px}
.events span{display:block;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(26px,2.6vw,36px);line-height:1.1}
.events small{display:block;font:300 12px Jost;letter-spacing:.14em;text-transform:uppercase;color:#9d9287;margin-top:8px}
.tagged{margin-top:48px;border-top:1px solid rgba(244,237,227,.14);padding-top:26px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px}
.tagged .eyebrow{flex:0 0 100%}
.tagged a{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;min-height:44px;display:inline-flex;align-items:center;color:#E9E0D3}
@media (max-width:860px){.seen{padding-top:64px;padding-bottom:52px}.events{grid-template-columns:1fr}.events li,.events li:nth-child(3n+2),.events li:nth-child(3n){padding:20px 0;border-left:0;border-right:0}.tagged a{font-size:21px}}
/* shop */
.shop{padding-top:110px;padding-bottom:60px}
.shop .top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.mood{position:relative;aspect-ratio:4/5;overflow:hidden;color:#fff;display:block}
.mood img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.mood:hover img{transform:scale(1.05)}
.mood::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(17,13,11,.72))}
.mood span{position:absolute;left:22px;right:22px;bottom:22px;z-index:2;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:36px;line-height:1}
.mood small{display:block;font:400 10px Jost;letter-spacing:.3em;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.mood em{display:block;font:300 13px Jost;font-style:normal;opacity:.85;margin-top:8px}
.filters{display:flex;gap:6px;margin:48px -20px 0;padding:0 20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:50px;padding:0 16px;font:400 11px Jost;letter-spacing:.24em;text-transform:uppercase;color:var(--mu);border-bottom:1px solid transparent;margin-bottom:-1px;transition:.25s}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 18px;margin-top:22px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:680px){.grid{grid-template-columns:repeat(2,1fr);gap:26px 12px}.card h3{font-size:21px}.moods{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:30px -20px 0;padding:0 20px}.moods::-webkit-scrollbar{display:none}.mood{flex:0 0 72%;scroll-snap-align:start}.shop{padding-top:72px;padding-bottom:40px}}
.card{display:flex;flex-direction:column;text-align:left;position:relative;min-width:0;white-space:normal}
.card .im{aspect-ratio:1;background:var(--card);display:flex;align-items:center;justify-content:center;padding:14%;transition:background .3s}
.card:hover .im{background:#fff}
.card img{mix-blend-mode:multiply;max-height:100%;object-fit:contain;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.07)}
.card h3{font-size:24px;line-height:1.1;margin-top:14px}
.card .m{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.08em;color:var(--mu);margin-top:4px;gap:6px}
.card .pr{color:var(--ink)}
.card s{color:var(--mu);margin-right:5px}
.tag{position:absolute;top:12px;left:12px;font:400 9px Jost;letter-spacing:.24em;text-transform:uppercase;padding:5px 8px;background:var(--ink);color:var(--iv)}
.tag.out{background:transparent;color:var(--mu);border:1px solid var(--line)}

/* try-on */
.try{background:var(--iv2);padding:110px 0}
.tin{display:grid;grid-template-columns:1fr 1.1fr;gap:60px;align-items:center}
.tin>*{min-width:0}
.try p{color:var(--mu);margin-top:18px;max-width:40ch}
.upl{margin-top:30px;cursor:pointer}
.tstat{font-size:13px;color:var(--mu);margin-top:14px;min-height:20px}
.stage{position:relative;aspect-ratio:4/5;background:#000;border:1px solid var(--line);overflow:hidden}
.stage canvas{width:100%;height:100%;object-fit:cover;display:block}
.stage .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--mu);font:400 11px Jost;letter-spacing:.3em;text-transform:uppercase}
.stage .ph svg{width:120px;color:var(--ink);opacity:.6;animation:glow 2.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.25}to{opacity:.8}}
.styles{display:flex;gap:6px;overflow-x:auto;margin-top:14px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.styles::-webkit-scrollbar{display:none}
.styles button{flex:0 0 auto;min-height:48px;padding:0 14px;font:400 11px Jost;letter-spacing:.22em;text-transform:uppercase;color:var(--mu);border-bottom:1px solid transparent;margin-bottom:-1px}
.styles button.on{color:var(--ink);border-bottom-color:var(--ink)}
.sz{display:flex;align-items:center;gap:14px;margin-top:12px;font:400 10px Jost;letter-spacing:.26em;text-transform:uppercase;color:var(--mu);min-height:44px}
.sz input{flex:1;accent-color:var(--ink)}
@media (max-width:860px){.try{padding:72px 0}.tin{grid-template-columns:1fr;gap:28px}}

/* fit */
.fit{background:var(--deep);color:var(--lt);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:110px 0}
.fit .in{display:grid;grid-template-columns:1fr 1.2fr;gap:60px;align-items:start}
.fit .eyebrow{color:#9d9287}
.fit p{color:#B9AEA2;margin-top:16px;max-width:42ch}
.fit h4{font:400 10px Jost;letter-spacing:.32em;text-transform:uppercase;color:#9d9287;margin:26px 0 10px}
.fit h4:first-child{margin-top:0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{min-height:58px;border:1px solid rgba(244,237,227,.22);color:var(--lt);font-family:'Cormorant Garamond',serif;font-weight:300;font-size:22px;transition:.25s}
.opts button.on{background:var(--lt);color:var(--bk);border-color:var(--lt)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:26px}
.res a{background:var(--card);color:var(--bk);padding:14px 10px 16px;text-align:center;cursor:pointer}
.res img{aspect-ratio:1;object-fit:contain;mix-blend-mode:multiply}
.res b{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:21px;display:block;line-height:1.1;margin-top:6px}
.res small{font-size:12px;color:#6d625a}
@media (max-width:860px){.fit{padding:72px 0}.fit .in{grid-template-columns:1fr;gap:30px}.opts button{font-size:19px}}

/* how + kara */
.how{padding-top:110px;padding-bottom:110px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px}
.steps div{border-top:1px solid var(--ink);padding-top:22px}
.steps b{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:58px;line-height:1;display:block}
.steps p{margin-top:12px;color:var(--mu)}
@media (max-width:860px){.how{padding-top:72px;padding-bottom:72px}.steps{grid-template-columns:1fr;gap:18px}}
.kara{display:grid;grid-template-columns:1fr 1fr;background:var(--iv2)}
.kara .kimg{min-height:560px;overflow:hidden}
.kara .kimg img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.kara .t{padding:80px 7vw;align-self:center}
.kara blockquote{font-size:clamp(30px,3.6vw,46px);line-height:1.15;font-style:italic;margin-top:18px}
.kara p{margin-top:18px;color:var(--mu);max-width:44ch}
@media (max-width:860px){.kara{grid-template-columns:1fr}.kara .kimg{min-height:0;height:440px}.kara .t{padding:48px 20px 56px}}

/* faq + footer */
.faq{padding-top:110px;padding-bottom:110px;max-width:860px}
details{border-bottom:1px solid var(--line)}
summary{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:24px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:300 26px Jost;color:var(--mu);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 22px;color:var(--mu);max-width:60ch}
@media (max-width:860px){.faq{padding-top:72px;padding-bottom:72px}}
footer{background:var(--deep);color:var(--lt);border-top:1px solid var(--line);padding:80px 0 44px;text-align:center}
footer .seal{width:110px;margin:0 auto;color:var(--lt)}
footer nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;margin-top:30px;font:400 10px Jost;letter-spacing:.3em;text-transform:uppercase}
footer nav a{min-height:44px;display:flex;align-items:center}
footer small{display:block;color:#9d9287;margin-top:28px;font-size:11px;letter-spacing:.1em}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:70;opacity:0;pointer-events:none;transition:.35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:80;background:var(--iv2);transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.qv{left:50%;bottom:0;width:min(900px,100%);max-height:92vh;transform:translate(-50%,105%);display:grid;grid-template-columns:1fr 1fr}
.qv.on{transform:translate(-50%,0)}
.qv .im{background:var(--card);display:flex;align-items:center;justify-content:center;padding:40px}
.qv .im img{mix-blend-mode:multiply}
.qv .t{padding:40px 34px}
.qv h3{font-size:48px;line-height:1}
.qv .pr{font-size:15px;letter-spacing:.1em;margin-top:10px}
.qv ul{list-style:none;margin:22px 0;border-top:1px solid var(--line)}
.qv li{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--mu)}
.qv .btn{width:100%}
.close{position:absolute;top:8px;right:8px;width:44px;height:44px;font-size:28px;line-height:1}
@media (max-width:680px){.qv{grid-template-columns:1fr}.qv .im{padding:24px;max-height:40vh}.qv .t{padding:24px 20px 32px}.qv h3{font-size:38px}}
.bag{top:0;right:0;height:100%;width:min(430px,100%);transform:translateX(105%);padding:26px 24px;display:flex;flex-direction:column}
.bag.on{transform:none}
.bag h3{font-size:38px}
.bag .items{flex:1;margin-top:18px;overflow-y:auto}
.bag .it{display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bag .it img{mix-blend-mode:multiply;background:var(--card)}
.bag .it b{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:22px;display:block}

  fl=await v.FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetBuffer:buf},runningMode:'IMAGE',numFaces:1});

}
function lash(n){return lashes[n]||(lashes[n]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='../tryon/'+n+'.png'}))}
async function draw(){
  if(!img) return;
  ctx.drawImage(img,0,0,cv.width,cv.height);
  if(!lm) return;
  const L=await lash(style),k=+$('#trySize').value,W=cv.width,H=cv.height;
  const P=i=>({x:lm[i].x*W,y:lm[i].y*H});
  for(const [a,b,u,mir] of [[33,133,159,true],[362,263,386,false]]){
    const A=P(a),B=P(b),U=P(u);
    const w=Math.hypot(B.x-A.x,B.y-A.y)*k,h=w*L.height/L.width,ang=Math.atan2(B.y-A.y,B.x-A.x);

  }
}
